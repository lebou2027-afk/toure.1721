async function pdfSave(blob,name){

 else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

async function pdfWA(r){

 // L'image montre la facture directement dans la discussion, le PDF reste joint

 // Navigateur sans partage de fichier (ordinateur) : le PDF est enregistré, à joindre dans WhatsApp
 if(r.img)await pdfSave(r.img,r.imgName);

}

 try{

 b.disabled=false;if(!retry)b.textContent=lab;
}

<script>
// --- CORRECTION PDF + WHATSAPP ---
async function pdfSave(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name || 'facture.pdf';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1500);
}

async function pdfWA(PDF){
  try{
    // Crée le fichier PDF pour WhatsApp
    const file = new File([PDF.blob], PDF.name, {type:'application/pdf'});
    // Si le téléphone peut partager un fichier
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({
        files: [file],
        title: PDF.name,
        text: 'Facture QUINCAILLERIE TOURE & FRERES'
      });
      return; // On a partagé le PDF, on arrête
    }
  }catch(e){}

  // Si le partage direct n'est pas possible (vieux téléphone)
  await pdfSave(PDF.blob, PDF.name);
  alert('PDF téléchargé ! Maintenant va dans WhatsApp > Trombone 📎 > Document > Choisis le PDF');
}
// --- FIN CORRECTION ---
</script>

function injectBlocProduit(){
  // Pas sur écran code PIN
  if(document.body.innerText.includes("Entrez votre code")){ let o=document.getElementById("boxNouveauProduit"); if(o) o.remove(); return; }
  if(document.getElementById("boxNouveauProduit")) return;
  
  let html=`<div id="boxNouveauProduit" style="display:block !important;margin:12px;padding:14px;border:2px dashed #1e3a8a;border-radius:12px;background:#f8faff;position:relative;z-index:9999">

    <input id="desigNew" placeholder="Désignation ex: Marteau 1kg" style="width:100%;padding:12px;border:1px solid #999;border-radius:8px;margin-bottom:8px;box-sizing:border-box">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="puNew" type="number" placeholder="Prix unitaire" style="flex:2;padding:12px;border:1px solid #999;border-radius:8px">

  </div>`;

  // TROUVE LE DERNIER PRODUIT AVEC FCFA
  let produits=Array.from(document.querySelectorAll("div")).filter(d=>d.textContent.includes("FCFA") && d.textContent.includes("Stock"));
  if(produits.length>0){
    let dernier=produits[produits.length-1];
    // remonte 2 niveaux pour être après la carte
    let cont=dernier;
    for(let i=0;i<3;i++){ if(cont.parentElement) cont=cont.parentElement; }
    cont.insertAdjacentHTML("afterend", html);
    return;
  }
  // Fallback
  let panier=null; document.querySelectorAll("div").forEach(d=>{ if(!panier && d.textContent.trim()==="Panier") panier=d; });
  if(panier) panier.parentElement.insertAdjacentHTML("beforebegin", html);
  else document.body.insertAdjacentHTML("beforeend", html);
}
